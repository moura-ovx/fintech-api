spring.application.name=fintech

spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521:xe}

# Usuário do banco de dados
spring.datasource.username=${DB_USER:usuario_padrao}
# Senha do banco de dados
spring.datasource.password=${DB_PASSWORD:senha_padrao}

# Mostrar as instruções SQL
# executadas no banco de dados
spring.jpa.show-sql=true